<!doctype html>
<html>
<head><title>TestCo — support that answers itself</title></head>
<body>
  <header>
    <!-- The hamburger comes FIRST in DOM order. This is the trap the old
         querySelector fell into: it returned the first match of the whole
         selector list, which is this 18px icon, not the logo below it. -->
    <button class="menu-toggle" aria-label="Toggle menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M3 12h18M3 6h18M3 18h18" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <a class="logo" href="/" aria-label="TestCo home">
      <svg width="180" height="44" viewBox="0 0 180 44" fill="none">
        <rect x="2" y="2" width="40" height="40" rx="10" fill="#0A84FF"/>
        <text x="22" y="30" font-size="24" fill="#fff" text-anchor="middle">T</text>
        <text x="54" y="32" font-size="30" fill="#111" font-family="sans-serif">TestCo</text>
      </svg>
    </a>
  </header>
  <main>
    <h1>Every ticket answers itself</h1>
    <p>TestCo is the AI support agent that resolves before you reply.</p>
  </main>
</body>
</html>
